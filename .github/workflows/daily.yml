name: Daily EPL predictions

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epl-model-publish
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install -e .
      - name: Restore immutable prediction log
        run: |
          git fetch origin data || true
          mkdir -p logs
          for file in prediction_log.jsonl scored_predictions.jsonl; do
            if git show "origin/data:logs/$file" > "/tmp/$file" 2>/dev/null; then
              cp "/tmp/$file" "logs/$file"
            fi
          done
          mkdir -p output
          for file in latest.json fixtures.json ratings.json season.json performance.json; do
            if git show "origin/data:output/$file" > "output/$file" 2>/dev/null; then
              :
            else
              rm -f "output/$file"
            fi
          done
      - name: Load Understat non-penalty xG export
        env:
          UNDERSTAT_NPXG_URL: ${{ secrets.UNDERSTAT_NPXG_URL }}
        run: |
          if [ -z "$UNDERSTAT_NPXG_URL" ]; then
            echo "Missing UNDERSTAT_NPXG_URL secret: provide a verified Understat npxG export URL." >&2
            exit 1
          fi
          curl --fail --location --silent --show-error "$UNDERSTAT_NPXG_URL" -o data/raw/understat_npxg.csv
      - name: Generate validated snapshot
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python run_daily.py
      - name: Stage prediction log for publication
        run: |
          cp -R logs /tmp/epl-logs
          cp -R output /tmp/epl-output
      - name: Publish snapshot to data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          git fetch origin data || true
          if [ -n "$SUPABASE_URL" ]; then
            echo "Supabase snapshot published by run_daily.py"
          else
            echo "Publishing snapshot to the data branch"
          fi
          if git show-ref --verify --quiet refs/remotes/origin/data; then
            git worktree add -B data /tmp/epl-data origin/data
          else
            git worktree add --detach /tmp/epl-data HEAD
            git -C /tmp/epl-data switch --orphan data
          fi
          rm -rf /tmp/epl-data/output /tmp/epl-data/logs
          cp -R /tmp/epl-output /tmp/epl-data/output
          cp -R /tmp/epl-logs /tmp/epl-data/logs
          git -C /tmp/epl-data config user.name "github-actions[bot]"
          git -C /tmp/epl-data config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/epl-data add output logs
          git -C /tmp/epl-data commit -m "Publish EPL predictions $(date -u +%F)" || exit 0
          git -C /tmp/epl-data push origin data
